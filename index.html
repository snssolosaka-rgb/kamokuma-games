<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>カモクマ商店街 ミニゲーム横丁</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#27315c">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カモクマ">
<meta name="description" content="カモクマ商店街のミニゲーム4本入り。1台のスマホをみんなで囲んで遊べるで。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --dusk:#27315c; --dusk2:#5a3d6b; --sunset:#f08a5d; --paper:#fffaf0; --ink:#2a1a10;
  --maru:#e8692e; --hana:#e86e98; --sam:#2f4b9a; --ten:#e3a52b; --negi:#6db33f;
  --sign:"Dela Gothic One","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--dusk);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,var(--dusk) 0%,var(--dusk2) 45%,var(--sunset) 100%)}
/* ===== メニュー(商店街) ===== */
#menu{position:absolute;inset:0;overflow-y:auto;padding:18px 14px 28px}
.board{position:relative;margin:6px auto 22px;background:var(--paper);border:5px solid var(--ink);border-radius:10px;padding:14px 10px 12px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.board:before,.board:after{content:"";position:absolute;top:-30px;width:4px;height:26px;background:var(--ink)}
.board:before{left:22%}.board:after{right:22%}
.board .small{font-family:var(--body);font-weight:900;font-size:14px;color:#7a4a22;letter-spacing:.3em}
.board h1{margin:2px 0 0;font-family:var(--sign);font-weight:400;font-size:clamp(30px,9vw,44px);line-height:1.1;color:var(--ink)}
.lanterns{display:flex;justify-content:space-between;margin:0 6px -8px}
.lantern{width:22px;height:30px;border-radius:50%/40%;background:radial-gradient(circle at 50% 40%,#ffe9a8,#ff9a3c 70%);box-shadow:0 0 18px 6px rgba(255,170,70,.55)}
.shop{display:block;width:100%;border:none;background:none;padding:0;margin:0 0 18px;text-align:left;cursor:pointer}
.awning{height:46px;border:4px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;background:repeating-linear-gradient(90deg,var(--c) 0 34px,#fffaf0 34px 68px);position:relative}
.scallop{height:16px;margin-top:-1px;background:radial-gradient(circle at 17px -2px,var(--c) 15px,transparent 16px) 0 0/34px 16px repeat-x;border-left:4px solid var(--ink);border-right:4px solid var(--ink);position:relative;z-index:1}
.front{display:flex;gap:12px;align-items:center;background:var(--paper);border:4px solid var(--ink);border-top:none;border-radius:0 0 10px 10px;padding:10px 12px 12px;box-shadow:0 7px 0 rgba(0,0,0,.28)}
.front canvas{flex:none;width:96px;height:96px;border-radius:12px;background:#f3e9d6}
.front .name{font-family:var(--sign);font-size:21px;line-height:1.25;color:var(--ink)}
.front .desc{font-size:13.5px;line-height:1.55;font-weight:700;color:#5a4636;margin-top:4px}
.front .tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:900;color:#fff;background:var(--c);border-radius:999px;padding:2px 10px}
.shop:active .front{transform:translateY(3px);box-shadow:0 4px 0 rgba(0,0,0,.28)}
.shop:focus-visible{outline:4px solid #ffe9a8;outline-offset:4px;border-radius:12px}
.links{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:8px}
.links a{display:block;width:100%;max-width:340px;text-align:center;text-decoration:none;font-weight:900;font-size:15px;color:#fff;border-radius:999px;padding:12px 16px;border:3px solid var(--ink)}
.links .ig{background:linear-gradient(90deg,#f58529,#dd2a7b,#8134af)}
.links .line{background:#06c755}
.install{margin:16px auto 0;max-width:340px;background:rgba(255,250,240,.95);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;text-align:center;font-weight:700;font-size:13.5px;line-height:1.6;color:var(--ink)}
.install button{margin-top:6px;border:3px solid var(--ink);background:var(--negi);color:#fff;font-weight:900;font-size:15px;border-radius:999px;padding:8px 18px}
.foot{color:#fff7e6;opacity:.85;text-align:center;font-size:12px;margin-top:14px;line-height:1.6}
/* ===== ゲーム画面 ===== */
#game{position:absolute;inset:0;display:none;flex-direction:column}
#game.on{display:flex}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;color:#fff}
.topbar button{border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:900;font-size:14px;border-radius:999px;padding:6px 12px}
.topbar .gtitle{font-family:var(--sign);font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:relative;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
#stage canvas.main{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;background:rgba(255,250,240,.94);z-index:5}
.ov h2{font-family:var(--sign);font-weight:400;font-size:clamp(26px,8vw,36px);margin:4px 0 6px;line-height:1.2}
.ov p{margin:4px 0;font-weight:700;font-size:15px;line-height:1.6;color:#4a3626;max-width:340px}
.ov .big{font-family:var(--sign);font-size:56px;line-height:1.1}
.btn{border:4px solid var(--ink);background:var(--negi);color:#fff;font-weight:900;font-size:19px;border-radius:999px;padding:12px 30px;margin:8px 4px;box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sub{background:var(--paper);color:var(--ink);font-size:16px;padding:9px 22px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pick{border:3px solid var(--ink);background:var(--paper);font-weight:900;font-size:17px;border-radius:12px;padding:8px 16px}
.pick.on{background:#ffe08a}
.how{background:#fff;border:3px dashed #c9b28e;border-radius:12px;padding:8px 12px;margin:10px 0;max-width:340px;text-align:left;font-size:14px;font-weight:700;line-height:1.7;color:#4a3626}
.hold{position:absolute;left:12px;right:12px;bottom:12px;height:96px;border:4px solid var(--ink);border-radius:22px;background:var(--hana);color:#fff;font-family:var(--sign);font-size:24px;box-shadow:0 6px 0 var(--ink);z-index:3}
.hold.down{transform:translateY(5px);box-shadow:0 1px 0 var(--ink);background:#c94f7a}
.hold.top{top:12px;bottom:auto;transform:rotate(180deg);background:var(--negi)}
.hold.top.down{transform:rotate(180deg) translateY(5px)}
.hold:disabled{background:#9a9a9a}
.zone{position:absolute;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);border-radius:20px;z-index:2;font-family:var(--sign);color:#fff;font-size:20px}
.zone.flip{transform:rotate(180deg)}
.zone.out{filter:grayscale(1) brightness(.7)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="menu"></div>
  <div id="game">
    <div class="topbar"><button id="back">◀ 商店街へ</button><div class="gtitle" id="gtitle"></div><button id="mute" aria-label="音のオンオフ">🔊</button></div>
    <div id="stage"><canvas class="main" id="cv"></canvas></div>
  </div>
</div>
<script>
"use strict";
const LINE_URL = "https://store.line.me/stickershop/author/32455/ja";
const IG_URL = "https://www.instagram.com/kamokuma_official/";
function drawNegi(c, x, y, s = 1) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = "#f4f1e0"; c.fillRect(-3, 0, 6, 16);
  c.fillStyle = "#6db33f"; c.fillRect(-3, -16, 6, 16);
  c.fillStyle = "#8cc95a"; c.fillRect(-1, -16, 2, 14);
  c.restore();
}
function drawFace(c, stunned, stroke = "#2b2b2b") {
  if (stunned) {
    c.strokeStyle = stroke; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(-6, -9); c.lineTo(-2, -6); c.moveTo(-2, -9); c.lineTo(-6, -6); c.stroke();
    c.beginPath(); c.moveTo(2, -9); c.lineTo(6, -6); c.moveTo(6, -9); c.lineTo(2, -6); c.stroke();
  } else {
    c.fillStyle = "#2b2b2b";
    c.beginPath(); c.arc(-4.5, -8, 1.8, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(4.5, -8, 1.8, 0, Math.PI * 2); c.fill();
  }
  c.fillStyle = "#f5a8a0";
  c.beginPath(); c.arc(-8, -3.5, 2.2, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(8, -3.5, 2.2, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#f2c31b";
  c.beginPath(); c.ellipse(0, -3, 4.5, 3, 0, 0, Math.PI * 2); c.fill();
}
function drawKamo(c, x, y, face, bob, stunned, s = 1) {
  c.save(); c.translate(x, y + bob); c.scale(face * s, s);
  c.save(); c.rotate(-0.5); drawNegi(c, -10, -14, 1); c.restore();
  c.fillStyle = "#a9825f"; c.beginPath(); c.ellipse(0, 8, 15, 13, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#f2c31b";
  c.beginPath(); c.ellipse(-6, 20, 4, 2.5, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(6, 20, 4, 2.5, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#fffdf6"; c.beginPath(); c.arc(0, -8, 13, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#2b2b2b";
  c.beginPath(); c.arc(0, -10, 13.5, Math.PI * 0.95, Math.PI * 2.05); c.fill();
  c.beginPath(); c.ellipse(-11, -6, 3.5, 8, 0.15, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(11, -6, 3.5, 8, -0.15, 0, Math.PI * 2); c.fill();
  drawFace(c, stunned); c.restore();
}
function drawKuma(c, x, y, face, bob, stunned, s = 1, blue = false) {
  c.save(); c.translate(x, y + bob); c.scale(face * s, s);
  const body = blue ? "#5a7fb0" : "#9a6b45";
  c.fillStyle = body;
  c.beginPath(); c.arc(-9, -18, 5, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(9, -18, 5, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(0, 8, 16, 14, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = blue ? "#3d5a8a" : "#d8452e";
  c.beginPath(); c.ellipse(0, 11, 13, 10, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = body; c.beginPath(); c.arc(0, -8, 14, 0, Math.PI * 2); c.fill();
  c.fillStyle = blue ? "#8fb0d8" : "#e8d5b8";
  c.beginPath(); c.ellipse(0, -3, 7, 5.5, 0, 0, Math.PI * 2); c.fill();
  drawFace(c, stunned);
  // クマくんは鼻と口(共通の顔パーツのくちばしを、マズルで上書き)
  c.fillStyle = blue ? "#8fb0d8" : "#e8d5b8";
  c.beginPath(); c.ellipse(0, -2.4, 6.4, 4.6, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#3a2a1a"; c.beginPath(); c.ellipse(0, -4.2, 2.6, 1.8, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#3a2a1a"; c.lineWidth = 1.1;
  c.beginPath(); c.moveTo(0, -2.6); c.lineTo(0, -1.2); c.moveTo(-2.2, -0.4); c.quadraticCurveTo(0, 0.9, 2.2, -0.4); c.stroke();
  c.restore();
}
function drawJoshi(c, x, y, face, bob, stunned, s = 1) {
  c.save(); c.translate(x, y + bob); c.scale(face * s, s);
  c.save(); c.rotate(-0.5); drawNegi(c, -10, -14, 0.9); c.restore();
  c.fillStyle = "#a9825f"; c.beginPath(); c.ellipse(0, 8, 14, 12, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#f2c31b";
  c.beginPath(); c.ellipse(-5, 19, 4, 2.5, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(5, 19, 4, 2.5, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#fffdf6"; c.beginPath(); c.arc(0, -8, 13, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#3e7d3a";
  c.beginPath(); c.arc(0, -10, 13.5, Math.PI * 0.95, Math.PI * 2.05); c.fill();
  c.beginPath(); c.ellipse(-12, -2, 4, 9, 0.35, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(12, -2, 4, 9, -0.35, 0, Math.PI * 2); c.fill();
  drawFace(c, stunned); c.restore();
}
// サム: 青着物(#1E3A8A)+グレー袴(#6B7280)+黒髪ちょんまげ+木刀
function drawSam(c, x, y, face, bob, stunned, s = 1) {
  c.save(); c.translate(x, y + bob); c.scale(face * s, s);
  // 木刀(肩に担ぐ)
  c.save(); c.translate(-9, -8); c.rotate(-0.7);
  c.fillStyle = "#8a5a2a"; c.fillRect(-2.2, -24, 4.4, 24);
  c.fillStyle = "#5a3a1a"; c.fillRect(-3, -2, 6, 6);
  c.restore();
  // 袴
  c.fillStyle = "#6B7280";
  c.beginPath(); c.moveTo(-12, 4); c.lineTo(12, 4); c.lineTo(15, 21); c.lineTo(-15, 21); c.closePath(); c.fill();
  c.strokeStyle = "#565e6b"; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(-5, 8); c.lineTo(-6, 19); c.moveTo(0, 8); c.lineTo(0, 19); c.moveTo(5, 8); c.lineTo(6, 19); c.stroke();
  // 着物(上半身)
  c.fillStyle = "#1E3A8A";
  c.beginPath(); c.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2); c.fill();
  // 帯
  c.fillStyle = "#3a3a3a"; c.fillRect(-12, 3, 24, 4);
  // 襟元
  c.fillStyle = "#fffdf6";
  c.beginPath(); c.moveTo(-5, -8); c.lineTo(0, 2); c.lineTo(5, -8); c.closePath(); c.fill();
  // 顔
  c.fillStyle = "#f2d5b0"; c.beginPath(); c.arc(0, -12, 11.5, 0, Math.PI * 2); c.fill();
  // 髪(前髪ライン)+ちょんまげ
  c.fillStyle = "#2b2b2b";
  c.beginPath(); c.arc(0, -14, 11.8, Math.PI * 1.02, Math.PI * 1.98); c.fill();
  c.beginPath(); c.ellipse(0, -26, 4.5, 2.6, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(-10.5, -10, 2.6, 6, 0.2, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(10.5, -10, 2.6, 6, -0.2, 0, Math.PI * 2); c.fill();
  // 目(キリッと)と眉
  if (stunned) {
    c.strokeStyle = "#2b2b2b"; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(-6.5, -14); c.lineTo(-2.5, -11); c.moveTo(-2.5, -14); c.lineTo(-6.5, -11); c.stroke();
    c.beginPath(); c.moveTo(2.5, -14); c.lineTo(6.5, -11); c.moveTo(6.5, -14); c.lineTo(2.5, -11); c.stroke();
  } else {
    c.fillStyle = "#2b2b2b";
    c.fillRect(-6.5, -13.5, 3.4, 2);
    c.fillRect(3.1, -13.5, 3.4, 2);
    c.fillRect(-7.5, -17.5, 5, 1.6);
    c.fillRect(2.5, -17.5, 5, 1.6);
  }
  // あごひげ(ちょい)
  c.fillStyle = "#2b2b2b";
  c.beginPath(); c.ellipse(0, -3.5, 3.4, 1.4, 0, 0, Math.PI * 2); c.fill();
  c.restore();
}
// ポチ: 黄金色(#FFD55A)の犬っぽい猫、赤い首輪
function drawPochi(c, x, y, face, bob, s = 1) {
  c.save(); c.translate(x, y + bob); c.scale(face * s, s);
  c.fillStyle = "#FFD55A";
  // しっぽ(くるん)
  c.beginPath(); c.arc(-11, -3, 4, 0, Math.PI * 2); c.fill();
  // 体
  c.beginPath(); c.ellipse(-2, 3, 10, 7.5, 0, 0, Math.PI * 2); c.fill();
  // 頭
  c.beginPath(); c.arc(7, -5, 8, 0, Math.PI * 2); c.fill();
  // 耳(猫っぽい三角x2)
  c.beginPath(); c.moveTo(1.5, -10); c.lineTo(3, -16.5); c.lineTo(7, -11.5); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(8.5, -11.5); c.lineTo(12, -16.5); c.lineTo(13, -9.5); c.closePath(); c.fill();
  // 足
  c.beginPath(); c.ellipse(-7, 10, 3, 2, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(3, 10, 3, 2, 0, 0, Math.PI * 2); c.fill();
  // 赤い首輪
  c.strokeStyle = "#d8452e"; c.lineWidth = 2.4;
  c.beginPath(); c.arc(6, -1.5, 6.2, 0.35, Math.PI - 0.55); c.stroke();
  // 顔
  c.fillStyle = "#2b2b2b";
  c.beginPath(); c.arc(4.5, -6.5, 1.3, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(9.5, -6.5, 1.3, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(7, -3.6, 1.1, 0, Math.PI * 2); c.fill();
  // ほっぺ
  c.fillStyle = "#f5a8a0";
  c.beginPath(); c.arc(2.5, -3.8, 1.5, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(11.5, -3.8, 1.5, 0, Math.PI * 2); c.fill();
  c.restore();
}
// 店長: はなむらの店長。クリーム色の毛・垂れ耳・黒ヘッドホン・茶色のエプロン(はなむら名札)・しっぽ
function drawTencho(c, x, y, face, bob, stunned, s = 1) {
  c.save(); c.translate(x, y + bob); c.scale(face * s, s);
  const fur = "#f6e4ae", furDark = "#e3c98a";
  // しっぽ
  c.strokeStyle = fur; c.lineWidth = 4; c.lineCap = "round";
  c.beginPath(); c.moveTo(-12, 10); c.quadraticCurveTo(-21, 5, -19, -3); c.stroke();
  // 足
  c.fillStyle = fur;
  c.beginPath(); c.ellipse(-6, 20, 4.5, 3, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(6, 20, 4.5, 3, 0, 0, Math.PI * 2); c.fill();
  // 体
  c.beginPath(); c.ellipse(0, 8, 14.5, 13, 0, 0, Math.PI * 2); c.fill();
  // 茶色のエプロン+名札
  c.fillStyle = "#6b4a2e";
  c.beginPath(); c.moveTo(-10, 0); c.lineTo(10, 0); c.lineTo(12, 19); c.lineTo(-12, 19); c.closePath(); c.fill();
  c.fillStyle = "#fffdf6"; c.fillRect(-5, 6, 10, 4.5);
  c.fillStyle = "#6b4a2e"; c.fillRect(-3.5, 7.6, 7, 1.2);
  // 頭
  c.fillStyle = fur; c.beginPath(); c.arc(0, -9, 13.5, 0, Math.PI * 2); c.fill();
  // 垂れ耳
  c.fillStyle = furDark;
  c.beginPath(); c.ellipse(-12.5, -10, 4, 7, 0.35, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(12.5, -10, 4, 7, -0.35, 0, Math.PI * 2); c.fill();
  // ヘッドホン(バンド+イヤーカップ)
  c.strokeStyle = "#1f1f1f"; c.lineWidth = 3;
  c.beginPath(); c.arc(0, -9, 15, Math.PI * 1.05, Math.PI * 1.95); c.stroke();
  c.fillStyle = "#1f1f1f";
  c.beginPath(); c.ellipse(-14, -6, 3.6, 5.2, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(14, -6, 3.6, 5.2, 0, 0, Math.PI * 2); c.fill();
  // マズル

      c.fillText(`P${this.pl + 1} ${CNAME[PCHAR[this.pl]]}  ${this.k + 1}/${this.per}個目`, 22, 80);
      c.textAlign = "right"; c.fillText(`合計 ${this.tot[this.pl]}点`, w - 22, 80);

function drawDango(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.strokeStyle = "#8a5a2a"; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -16); c.lineTo(0, 16); c.stroke();
  [["#f5a8c0", -9], ["#fffaf0", 0], ["#9ed26f", 9]].forEach(([col, dy]) => { c.fillStyle = col; c.strokeStyle = "#5a3a2a"; c.lineWidth = 1.2; c.beginPath(); c.arc(0, dy, 5.2, 0, Math.PI * 2); c.fill(); c.stroke(); });
  c.restore();
}

window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstall = e; addInstallBtn(document.getElementById("install")); });
window.addEventListener("appinstalled", () => { const i = document.getElementById("install"); if (i) i.remove(); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(() => {});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildMenu); else buildMenu();
</script>
